version: '3.8'

# XCity AI Hub — New-API Production Stack
# Required env vars (set in .env or CI secrets):
#   POSTGRES_PASSWORD, REDIS_PASSWORD, SESSION_SECRET,
#   SQL_DSN (auto-constructed below if using this file directly)
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d

services:
  new-api:
    image: ${DOCKER_IMAGE:-xcityus/xct-new-api}:${IMAGE_TAG:-latest}
    container_name: xct-new-api
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - api_data:/data
      - api_logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER:-xcity}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-newapi}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_NAME=${NODE_NAME:-xct-node-1}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - STREAMING_TIMEOUT=${STREAMING_TIMEOUT:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xct-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/status | grep -o '\"success\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: xct-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xcity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-newapi}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - xct-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xcity} -d ${POSTGRES_DB:-newapi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: xct-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - xct-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api_data:
  api_logs:
  pg_data:
  redis_data:

networks:
  xct-network:
    driver: bridge
    name: xct-network
